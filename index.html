<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyderabad Durga Puja Parikrama</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pujaRed: '#b91c1c',
                        pujaGold: '#f59e0b',
                        pujaCream: '#fdf8f5',
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-pujaCream text-gray-800 antialiased">

    <header class="bg-pujaRed text-white py-16 px-4 text-center border-b-8 border-pujaGold relative">
        <div class="relative z-10 max-w-4xl mx-auto">
            <h1 class="text-4xl md:text-5xl font-serif font-bold mb-4">Hyderabad Durga Puja Parikrama</h1>
            <p class="text-lg md:text-xl font-sans text-pujaGold tracking-wide">সার্বজনীন দুর্গোৎসব ২০২৬</p>
            <p class="mt-4 font-light text-sm md:text-base opacity-90">Your verified guide to 54 pandals across the city.</p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-12">
        
        <!-- Hi-Tech City Section -->
        <div class="mb-12">
            <div class="mb-8 text-center">
                <h2 class="text-3xl font-serif font-bold text-pujaRed border-b-2 border-pujaGold inline-block pb-2">Hi-Tech City & West Hyderabad</h2>
            </div>
            <div id="west-hyd-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <!-- Central/Secunderabad Section -->
        <div class="mb-12">
            <div class="mb-8 text-center">
                <h2 class="text-3xl font-serif font-bold text-pujaRed border-b-2 border-pujaGold inline-block pb-2">Central & North Hyderabad</h2>
            </div>
            <div id="central-hyd-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <!-- Old City Section -->
        <div class="mb-12">
            <div class="mb-8 text-center">
                <h2 class="text-3xl font-serif font-bold text-pujaRed border-b-2 border-pujaGold inline-block pb-2">Old City & Other Areas</h2>
            </div>
            <div id="old-city-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

    </main>

    <footer class="bg-gray-900 text-gray-400 py-8 text-center text-sm">
        <p>Created for the Hyderabad Bengali Community.</p>
    </footer>

    <script>

                { name: "Uttaran Bangiya Samity", location: "KVMR Garden, Narsingi", cat: "বারোয়ারি (Barowari)", map: "KVMR+Garden+Narsingi+Hyderabad" },
                { name: "Rituranga Kokapet", location: "Sri Hanuman Devalayam, Kokapet", cat: "বারোয়ারি (Barowari)", map: "Sri+Hanuman+Devalayam+Kokapet+Hyderabad" },
                { name: "Kokapet Urban Sarbojonin", location: "Kokapet", cat: "বারোয়ারি (Barowari)", map: "Kokapet+Hyderabad" },

            ],
            central: [
                { name: "Attapur Bengali Association", location: "Chinna Ananthagiri Shivalayam", cat: "বারোয়ারি (Barowari)", map: "Chinna+Ananthagiri+Shivalayam+Attapur+Hyderabad" },
                { name: "Bengalee Cultural Association", location: "Banjara Function Hall, Masab Tank", cat: "বারোয়ারি (Barowari)", map: "Banjara+Function+Hall+Masab+Tank+Hyderabad" },
                { name: "Bangiya Sanskritik Sangha", location: "Keyes High School, Secunderabad", cat: "বারোয়ারি (Barowari)", map: "Keyes+High+School+Secunderabad" },
                { name: "Bangiya Shiksha Niketan", location: "Telangana Garden, Bowenpally", cat: "বারোয়ারি (Barowari)", map: "Telangana+Garden+Function+Hall+Bowenpally+Hyderabad" },
                { name: "Bangali Sanskritik Sangha", location: "Shubasree Garden, Alwal", cat: "বারোয়ারি (Barowari)", map: "Shubasree+Garden+Alwal+Hyderabad" },
                { name: "Bani Sangha", location: "Lakshmi Kala Theatre Lane, Alwal", cat: "বারোয়ারি (Barowari)", map: "Lakshmi+Kala+Theatre+Alwal+Hyderabad" },
                { name: "Hyderabad Kalibari", location: "Ammaguda, Sainikpuri", cat: "বারোয়ারি (Barowari)", map: "Hyderabad+Kalibari+Sainikpuri+Secunderabad" },
                { name: "Vedanga Sammilani", location: "Dairy Farm Road, Secunderabad", cat: "বারোয়ারি (Barowari)", map: "Dairy+Farm+Road+Secunderabad" },
                { name: "Navarun Sangha", location: "Balanagar", cat: "বারোয়ারি (Barowari)", map: "Balanagar+Hyderabad" },
                { name: "KSBC", location: "AMR Gardens, Kompally", cat: "বারোয়ারি (Barowari)", map: "AMR+Gardens+Kompally+Hyderabad" },
                { name: "Bangiya Radha Krishna Mandir", location: "Fox Sagar, Kompally", cat: "বারোয়ারি (Barowari)", map: "Fox+Sagar+Jeedimetla+Hyderabad" },
                { name: "Medchal Bengali Samiti", location: "Medchal", cat: "বারোয়ারি (Barowari)", map: "Medchal+Hyderabad" },
                { name: "Mallapur Bangiya Sangha", location: "VNR Gardens, Mallapur", cat: "বারোয়ারি (Barowari)", map: "VNR+Gardens+Mallapur+Hyderabad" },
                { name: "Bengali Ananda Utsav Sangha", location: "HCL Community Hall, Mallapur", cat: "বারোয়ারি (Barowari)", map: "HCL+Community+Hall+Mallapur+Hyderabad" },
                { name: "Hyd Bengali Swarna Shilpi Mandir", location: "Shamshabad", cat: "বারোয়ারি (Barowari)", map: "Vivekananda+Kali+Mandir+Shamshabad+Hyderabad" },
                { name: "Adi Bari Pujo", location: "Sheshadri Nagar, Rampally", cat: "Bari Pujo (Private)", map: "Sheshadri+Nagar+Rampally+Hyderabad" },
                { name: "Air Force Station Begumpet", location: "Begumpet", cat: "Institutional (Restricted)", map: "Air+Force+Station+Begumpet+Hyderabad" },
                { name: "Hyderabad Bengalee Samity", location: "NTR Stadium, Domalguda", cat: "বারোয়ারি (Barowari)", map: "NTR+Stadium+Domalguda+Hyderabad" },
                { name: "Ramakrishna Mission", location: "Domalguda", cat: "বারোয়ারি (Barowari)", map: "Ramakrishna+Math+Domalguda+Hyderabad" },
                { name: "Bengali Swarnashilpi Association", location: "Surabhi Garden, Bolton Rd", cat: "বারোয়ারি (Barowari)", map: "Surabhi+Garden+Bolton+Road+Secunderabad" },
                { name: "Chitra Sarbojanin Durgautsav", location: "Gym Khana Ground", cat: "বারোয়ারি (Barowari)", map: "Gymkhana+Grounds+Secunderabad" }
            ],
            oldCity: [
                { name: "Hyderabad Bengali Welfare Assoc.", location: "Minar Garden", cat: "বারোয়ারি (Barowari)", map: "Minar+Garden+Salarjung+Museum+Hyderabad" },
                { name: "Young Star Association", location: "Gayatri Bhavan", cat: "বারোয়ারি (Barowari)", map: "Gayatri+Bhavan+Hyderabad" },
                { name: "Hyd Charkaman Bengali Samithi", location: "P. Satyanarayan Bhavan", cat: "বারোয়ারি (Barowari)", map: "P+Satyanarayan+Bhavan+Hyderabad" },
                { name: "Swami Vivekanando Sangha", location: "Library Bhavan", cat: "বারোয়ারি (Barowari)", map: "Library+Bhavan+Hyderabad" },
                { name: "Ramkrishna Bengali Seva Samiti", location: "Murlidhar Temple", cat: "বারোয়ারি (Barowari)", map: "Murlidhar+Bagh+Hyderabad" },
                { name: "Chelapura Bengali Association", location: "Chelapura", cat: "বারোয়ারি (Barowari)", map: "Chelapura+Hyderabad" },
                { name: "Bengali Durga Utsab Committee", location: "Quli Qutub Shah Stadium", cat: "বারোয়ারি (Barowari)", map: "Quli+Qutub+Shah+Stadium+Hyderabad" },
                { name: "Navajagran Association", location: "Begum Bazar", cat: "বারোয়ারি (Barowari)", map: "Begum+Bazar+Hyderabad" },
                { name: "Bajrang Vyamshala Durga Puja", location: "Bandi ke Adda", cat: "বারোয়ারি (Barowari)", map: "Bandi+ka+Adda+Hyderabad" },
                { name: "Hyd Charminar Bengali Samity", location: "Rajasthan Bhavan", cat: "বারোয়ারি (Barowari)", map: "Rajasthan+Bhavan+Hyderabad" },
                { name: "Netaji Sangho", location: "Kalikaman", cat: "বারোয়ারি (Barowari)", map: "Kali+Kaman+Hyderabad" },
                { name: "Subh Bhavan", location: "Gulzar Houz", cat: "বারোয়ারি (Barowari)", map: "Gulzar+Houz+Hyderabad" },
                { name: "Laldarwaja Bengali Samity", location: "Shiva Parvati Function Hall, Gowlipura", cat: "বারোয়ারি (Barowari)", map: "Shiva+Parvati+Function+Hall+Gowlipura+Hyderabad" }
            ]
        };

        function renderCards(dataArray, containerId) {
            const container = document.getElementById(containerId);
            dataArray.forEach(puja => {
                const isBarowari = puja.cat.includes("Barowari");
                const badgeColor = isBarowari ? "bg-pujaGold text-red-900" : "bg-gray-200 text-gray-700";
                
                container.innerHTML += `
                    <div class="bg-white rounded-xl shadow-md hover:shadow-lg transition duration-300 overflow-hidden border border-gray-100 flex flex-col h-full">
                        <div class="p-6 flex-grow">
                            <span class="inline-block px-3 py-1 text-xs font-semibold rounded-full ${badgeColor} mb-3">
                                ${puja.cat}
                            </span>
                            <h3 class="text-xl font-serif font-bold text-gray-900 mb-2">${puja.name}</h3>
                            <p class="text-gray-600 text-sm flex items-start">
                                <svg class="w-4 h-4 mr-1 mt-0.5 text-pujaRed flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.243-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                ${puja.location}
                            </p>
                        </div>
                        <div class="bg-gray-50 border-t border-gray-100 p-4">
                            <a href="https://www.google.com/maps/search/?api=1&query=${puja.map}" target="_blank" class="block w-full text-center text-sm font-semibold text-pujaRed hover:text-red-900 transition">
                                View on Google Maps →
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        renderCards(pujas.west, 'west-hyd-grid');
        renderCards(pujas.central, 'central-hyd-grid');
        renderCards(pujas.oldCity, 'old-city-grid');
    </script>
</body>
</html>
